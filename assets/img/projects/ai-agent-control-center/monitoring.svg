<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Task execution and monitoring concept</title>
  <desc id="desc">Connected progress rings and flowing signals represent task execution and observation. A conceptual illustration, not an implemented dashboard or measured performance.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10273e"/><stop offset="1" stop-color="#071423"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#2c98f0" stop-opacity=".22"/><stop offset="1" stop-color="#2c98f0" stop-opacity="0"/></radialGradient>
    <linearGradient id="signal" x2="1"><stop stop-color="#2c98f0"/><stop offset="1" stop-color="#a6dfff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#8fcfff" opacity=".15"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <ellipse cx="400" cy="250" rx="330" ry="225" fill="url(#halo)"/>
  <g fill="none" stroke="#74beef"><path d="M130 250h540" stroke-width="2" opacity=".35"/><path d="M190 300v60h210v-55M400 195v-55h210v60" opacity=".4"/><path d="M130 322h540M130 178h540" opacity=".08" stroke-dasharray="4 8"/></g>
  <g fill="#0e2e48" stroke="#284d6a" stroke-width="7"><circle cx="190" cy="250" r="50"/><circle cx="400" cy="250" r="50"/><circle cx="610" cy="250" r="50"/></g>
  <g fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"><circle cx="190" cy="250" r="50"/><path d="M400 200a50 50 0 1 1-47.6 65.5"/><path d="M610 200a50 50 0 0 1 47.6 65.5"/></g>
  <path d="m174 250 11 11 22-22" fill="none" stroke="#b0e2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#b0e2ff" stroke-width="3" stroke-linecap="round"><path d="M381 253h8l6-12 10 22 7-10h8"/><circle cx="610" cy="250" r="13" stroke-dasharray="2 7"/></g>
  <g fill="#9cd8ff"><circle cx="285" cy="250" r="4"/><circle cx="505" cy="250" r="4"/><circle cx="310" cy="360" r="4"/><circle cx="505" cy="140" r="4"/></g>
  <g fill="none" stroke="#74beef" opacity=".25"><circle cx="400" cy="250" r="72"/><circle cx="190" cy="360" r="10"/><circle cx="610" cy="140" r="10"/></g>
</svg>
