<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">AI agent orchestration concept</title>
  <desc id="desc">A luminous central intelligence node connects six smaller agent nodes. An abstract concept, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10273e"/><stop offset="1" stop-color="#071423"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#2c98f0" stop-opacity=".25"/><stop offset="1" stop-color="#2c98f0" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x2="1" y2="1"><stop stop-color="#7bceff"/><stop offset="1" stop-color="#2c98f0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#8fcfff" opacity=".15"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <ellipse cx="400" cy="250" rx="310" ry="230" fill="url(#halo)"/>
  <g fill="none" stroke="#74beef">
    <ellipse cx="400" cy="250" rx="245" ry="158" opacity=".14" stroke-dasharray="4 9"/>
    <circle cx="400" cy="250" r="92" opacity=".25"/>
    <g stroke-width="2" opacity=".6"><path d="M400 250 210 140M400 250 590 140M400 250 650 250M400 250 590 360M400 250 210 360M400 250 150 250"/></g>
  </g>
  <g fill="#0e2e48" stroke="#68bdf5" stroke-width="2">
    <circle cx="210" cy="140" r="30"/><circle cx="590" cy="140" r="30"/>
    <circle cx="650" cy="250" r="30"/><circle cx="590" cy="360" r="30"/>
    <circle cx="210" cy="360" r="30"/><circle cx="150" cy="250" r="30"/>
  </g>
  <g fill="#a3ddff"><circle cx="210" cy="140" r="8"/><circle cx="590" cy="140" r="8"/><circle cx="650" cy="250" r="8"/><circle cx="590" cy="360" r="8"/><circle cx="210" cy="360" r="8"/><circle cx="150" cy="250" r="8"/></g>
  <g fill="#8ed6ff"><circle cx="300" cy="192" r="4"/><circle cx="502" cy="309" r="4"/><circle cx="533" cy="250" r="4"/></g>
  <path d="m400 190 52 30v60l-52 30-52-30v-60z" fill="url(#node)"/>
  <path d="m400 216 29 17v34l-29 17-29-17v-34z" fill="#103653"/>
  <g stroke="#c2eaff" stroke-width="2" fill="none"><path d="M385 250h30M400 235v30"/><circle cx="400" cy="250" r="20"/></g>
  <path d="M336 422h128" stroke="#74beef" opacity=".3"/>
</svg>
