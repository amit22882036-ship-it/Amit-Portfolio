<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent coordination concept</title>
  <desc id="desc">Three branching paths connect distinct agent nodes and converge on a shared destination. Abstract collaboration artwork, not a product interface.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10273e"/><stop offset="1" stop-color="#071423"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#2c98f0" stop-opacity=".22"/><stop offset="1" stop-color="#2c98f0" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x2="1" y2="1"><stop stop-color="#7bceff"/><stop offset="1" stop-color="#2c98f0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#8fcfff" opacity=".15"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <ellipse cx="400" cy="250" rx="340" ry="225" fill="url(#halo)"/>
  <g fill="none" stroke="#74beef" stroke-width="2" opacity=".65">
    <path d="M150 250h70q30 0 30-30v-70q0-30 30-30h220q30 0 30 30v70q0 30 30 30h90"/>
    <path d="M150 250h500"/>
    <path d="M150 250h70q30 0 30 30v70q0 30 30 30h220q30 0 30-30v-70q0-30 30-30h90"/>
    <path d="M400 155v190" opacity=".3" stroke-dasharray="4 8"/>
  </g>
  <g fill="#0e2e48" stroke="#68bdf5" stroke-width="2"><circle cx="150" cy="250" r="35"/><circle cx="650" cy="250" r="35"/></g>
  <g fill="url(#node)"><path d="m400 83 33 19v36l-33 19-33-19v-36z"/><path d="m400 213 33 19v36l-33 19-33-19v-36z"/><path d="m400 343 33 19v36l-33 19-33-19v-36z"/></g>
  <g fill="none" stroke="#103653" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m386 120 9 9 19-19"/><path d="m386 250 9 9 19-19"/><path d="m386 380 9 9 19-19"/></g>
  <g fill="#b0e2ff"><circle cx="150" cy="250" r="9"/><circle cx="650" cy="250" r="9"/><circle cx="300" cy="120" r="4"/><circle cx="495" cy="250" r="4"/><circle cx="300" cy="380" r="4"/></g>
  <g fill="none" stroke="#9cd8ff" stroke-width="2"><path d="m567 242 8 8-8 8M567 136l8 8-8 8" opacity=".6"/><circle cx="650" cy="250" r="48" opacity=".2"/></g>
</svg>
